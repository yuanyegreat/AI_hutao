plugins {
    id 'com.android.fufu'
}

android {
    // 保持 namespace 不变，这样你的代码就不需要大面积报错修改
    namespace 'com.example.digitalhuman' 
    compileSdk 33

    defaultConfig {
        // 【关键修改点】修改了 applicationId，系统就会把它当成一个新应用
        applicationId "com.example.digitalhuman.fufu.v2" 
        
        minSdk 24
        targetSdk 33
        // 既然是全新的应用，版本号建议重新从 1 开始计算
        versionCode 1 
        versionName "1.0" 
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    
    // === 关键修复代码：强制统一 Kotlin 版本，解决重复类冲突 ===
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
}
